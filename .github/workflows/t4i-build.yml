name: T4i baseline build
on:
  push:
    branches: [feature/t4i-baseline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pil python3-docutils zip unzip
      - name: Compile 650D firmware 1.0.4
        run: make -C platform/650D.104 -j"$(nproc)"
      - name: Verify archive
        run: |
          unzip -t platform/650D.104/build/magiclantern.zip
          unzip -Z1 platform/650D.104/build/magiclantern.zip | grep -i '^autoexec.bin$'
          unzip -Z1 platform/650D.104/build/magiclantern.zip | grep -i '^ML/modules/sd_clock.mo$'
          unzip -Z1 platform/650D.104/build/magiclantern.zip | grep -i '^ML/modules/burst.mo
        with:
          name: MagicLantern-650D104-baseline
          path: platform/650D.104/build/magiclantern.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MagicLantern-650D104-baseline
          path: platform/650D.104/build/magiclantern.zip
          if-no-files-found: error
